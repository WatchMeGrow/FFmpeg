version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run: sudo add-apt-repository universe -y
      - run: sudo apt update
      - run: sudo apt install yasm nasm libsvtav1-dev
      - run: ./configure --prefix=$(pwd)/out --enable-libsvtav1 --enable-encoder=libsvtav1 && make && make install
      - run: mkdir -p build && cd out && tar -cvzf ../build/ffmpeg.tar .
      - persist_to_workspace:
          root: build
          paths:
           - ffmpeg.tar
  publish:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - attach_workspace:
          at: build
      - run: aws s3 cp build/ffmpeg.tar s3://wmg-deploy/ffmpeg.tar

workflows:
  version: 2
  build-and-publish:
    jobs:
      - build
      - publish:
          requires:
            - build
          filters:
            branches:
              only: vendor
